name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: apt-get update && apt-get install -y shellcheck
      - name: Lint
        run: shellcheck -x bin/warden lib/core/*.sh lib/tui/*.sh lib/features/*.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and test dependencies
        run: |
          apt-get update
          apt-get install -y bats cryptsetup util-linux curl tang clevis clevis-luks python3
      - name: Run test suite as root (needed for losetup/cryptsetup/systemctl)
        run: bats tests/bats/
